name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Build with Buildozer
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
      run: |
        export PATH=$JAVA_HOME/bin:$PATH
        mkdir -p /home/runner/.android
        echo "2433038555c165f047bab166babf45d58723fde1" > /home/runner/.android/repositories.cfg
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
